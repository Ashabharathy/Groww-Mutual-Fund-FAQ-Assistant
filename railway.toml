# Railway Configuration for Groww MF Saathi Backend

[build]
# Build command - install all dependencies
builder = "nixpacks"

[deploy]
# Start command - run FastAPI server
startCommand = "python -m uvicorn src.phase4_ui.api:app --host 0.0.0.0 --port $PORT"

# Environment variables
[env]
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
